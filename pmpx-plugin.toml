# Read by pmpx when it scans the plugin directory; no dlopen is involved.
#
# `name` must equal `PackageManager::name()` -- the host refuses to load the library when they
# disagree, which is what catches a plugin directory assembled out of mismatched pieces.
[plugin]
name    = "yarn"
version = "0.3.0"
abi     = 3
family  = "node"

# Evidence used to score this backend against a project root.
#
# `yarn.lock` is strong (100): the project was actually resolved by yarn. `package.json` is weak
# (10): it only proves the ecosystem, and every Node backend claims it -- npm, pnpm and yarn all
# sit in the same tree, so the lockfile is what identifies the tool.
#
# `.yarnrc.yml` is strong (100) and carries a second job in the same entry: it exists only in
# yarn 2+ (berry), so matching it is also how the plugin learns which generation it is looking
# at -- `update` is `yarn up` under berry and `yarn upgrade` under classic. The host reports the
# hit through `Context::matched`; the plugin reads no file to find out.
[detect]
strong = ["yarn.lock", ".yarnrc.yml"]
weak   = ["package.json"]
